server {
      listen 80;
      server_name rewindproduction.ru www.rewindproduction.ru;

      # Редирект на HTTPS
      return 301 https://$host$request_uri;
  }

  server {
      listen 443 ssl http2;
      server_name rewindproduction.ru www.rewindproduction.ru;

      # SSL сертификаты
      ssl_certificate /etc/nginx/ssl/rewindproduction.ru.crt;
      ssl_certificate_key /etc/nginx/ssl/rewindproduction.ru.key;

      ssl_protocols TLSv1.2 TLSv1.3;
      ssl_ciphers HIGH:!aNULL:!MD5;
      ssl_prefer_server_ciphers on;
      ssl_session_cache shared:SSL:50m;
      ssl_session_timeout 10m;

      # Reverse proxy к Next.js
      location / {
          proxy_pass http://nextjs:3000;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection 'upgrade';
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_cache_bypass $http_upgrade;

          # Кэширование статики
          expires 30d;
          add_header Cache-Control "public, immutable";
      }

      # Заголовки безопасности
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Frame-Options "SAMEORIGIN";
      add_header X-Content-Type-Options "nosniff";
      add_header X-XSS-Protection "1; mode=block";

      # Логирование
      access_log /var/log/nginx/rewindproduction.ru.access.log;
      error_log /var/log/nginx/rewindproduction.ru.error.log;
  }