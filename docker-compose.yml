version: '3.8'

services:
nextjs:
  build:
	context: .
	dockerfile: Dockerfile
  container_name: nextjs-rewind
  restart: unless-stopped
  environment:
	- NODE_ENV=production
	- APP_URL=https://rewindproduction.ru
  networks:
	- app-network

nginx:
  image: nginx:alpine
  container_name: nginx-rewind
  restart: unless-stopped
  ports:
	- "80:80"
	- "443:443"
  volumes:
	- ./nginx/rewindproduction.ru.conf:/etc/nginx/conf.d/rewindproduction.ru.conf:ro
	- ./nginx/ssl:/etc/nginx/ssl:ro
  networks:
	- app-network

networks:
app-network:
  driver: bridge